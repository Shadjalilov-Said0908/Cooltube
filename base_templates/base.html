<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>{{ title }}</title>
</head>
<body class="bg-black">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid px-5">
        <a class="navbar-brand fw-bold" href="{% url 'main' %}">
            <span class="text-danger"><i class="bi bi-youtube"></i></span>
            CoolTube
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">О сайте</a>
                </li>

            </ul>
            <form class="d-flex me-auto" role="search" style="width: 600px" method="get" action="{% url 'search' %}">
                <input name="q" class="form-control  me-2" type="search"
                       placeholder="{% if request.GET.q %} {{ request.GET.q }} {% else %} Поиск {% endif %}"
                       aria-label="Поиск" style="border-radius: 20px;">
                <button class="btn btn-dark text-light rounded-circle border-light" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <ul class="navbar-nav mb-2 mb-lg-0">
                {% if not  request.user.is_authenticated %}
                <li class="nav-item">
                    <a class="btn btn-dark border-light mx-2" aria-current="page" href="{% url 'login' %}">
                        Войти
                    </a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="btn btn-dark border-light mx-2" aria-current="page" href="{% url 'add_content' %}">
                        Добавить
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        {{ request.user.username }}
                    </a>
                    <ul class="dropdown-menu bg-dark" style="left: -50px">
                        <li><a class="dropdown-item text-light bg-dark fw-bold"
                               href="{% url 'profile' request.user.pk %}">Мой профиль</a></li>
                        <li><a class="dropdown-item text-light bg-dark fw-bold" href="#">Другое действие</a></li>
                        <li>
                            <hr class="dropdown-divider bg-light text-light">
                        </li>
                        <li><a class="dropdown-item text-light bg-dark fw-bold" href="{% url 'logout' %}">Выйти</a></li>
                    </ul>
                </li>
                {% endif %}

            </ul>


        </div>
    </div>
</nav>

<main class="main mt-4 px-4">
    {% block main %}


    {% endblock main %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>
