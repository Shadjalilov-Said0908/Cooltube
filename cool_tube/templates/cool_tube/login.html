{% extends 'base.html' %}

{% block main %}

<div class="auth d-flex justify-content-center">

    <div class="col-3">
        <div class="card card-body text-light bg-black">
            <h5 class="text-center">{{ title }}</h5>

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-dark w-100" type="submit">войти</button>
                <hr class="bg-light">
                <small class="text-light">Нет аккаунта ?</small>
                <a href="{% url 'register' %}" class="btn btn-primary w-100">регистрация</a>
            </form>

        </div>
    </div>

</div>

{% endblock main %}
